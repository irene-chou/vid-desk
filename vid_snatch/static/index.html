<script>
// ===== 主題（#26 / #37）：在第一次繪製前就套好 data-theme，開頁不閃色 =====
// 純函式區塊由 tests/theme.test.mjs 以 node 直接測；下面主程式也沿用這幾個函式
// @@theme-begin
const THEME_KEY = "vid-snatch.theme";
const THEMES = ["system", "light", "dark"];

// 存值不在清單內（包含 null）一律當「跟隨系統」；#26 存過的 "system" 也視為跟隨系統（#37 之後只會存 light / dark）
function parseTheme(value) {
  return THEMES.includes(value) ? value : "system";
}

// 實際顯示的主題：跟隨系統時看系統是否為深色
function resolveTheme(theme, systemDark) {
  if (theme === "system") return systemDark ? "dark" : "light";
  return theme;
}

// 點頁首按鈕後要切到的主題：與目前實際顯示相反
function nextTheme(effective) {
  return effective === "dark" ? "light" : "dark";
}

// localStorage 可能整個不可用（隱私模式、停用 cookie），getStorage 與 getItem 都包在 try 裡
function readTheme(getStorage) {
  try { return parseTheme(getStorage().getItem(THEME_KEY)); } catch (e) { return "system"; }
}

// 「跟隨系統」是預設，直接把 key 刪掉；寫不進去就只在這次分頁生效
function writeTheme(getStorage, theme) {
  try {
    const storage = getStorage();
    if (theme === "system") storage.removeItem(THEME_KEY); else storage.setItem(THEME_KEY, theme);
  } catch (e) { /* 忽略 */ }
}

// 跟隨系統時拿掉 data-theme，讓 color-scheme: light dark 跟著系統；否則固定 light / dark
function applyTheme(root, theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
}
// @@theme-end
applyTheme(document.documentElement, readTheme(() => localStorage));
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* ===== 視覺 token（docs/superpowers/specs/2026-10-27-console-ui-design.md） ===== */
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #ffffff; --fg: #16181d; --muted: #6b7280; --line: #e2e4e9; --sub: #eef0f3;
    --accent: #0f766e; --accent-fg: #ffffff; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
    --sans: "IBM Plex Sans", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --r-panel: 12px; --r-card: 10px; --r-btn: 8px;
  }
  /* 主題（#26 / #37）：沒有 data-theme 就跟隨系統；按過頁首的切換鈕就固定 light / dark。
     深色 token 下面有兩份（系統深色且沒選淺色、明確選深色），改色票時兩處必須同步，tests/test_static.py 會比對。
     color-scheme 一起切，原生表單、捲軸、dialog backdrop 才會跟著變 */
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1114; --panel: #171a1f; --fg: #e6e8ec; --muted: #8b919c; --line: #262a31; --sub: #1f232a;
      --accent: #2dd4bf; --accent-fg: #06201c; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1114; --panel: #171a1f; --fg: #e6e8ec; --muted: #8b919c; --line: #262a31; --sub: #1f232a;
    --accent: #2dd4bf; --accent-fg: #06201c; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* body 是捲動容器：設定 modal 鎖住捲動時 scrollbar-gutter 仍保留捲軸空間，非 overlay 捲軸（Windows）下底層內容不位移
     （Chrome 對 html 的 scrollbar-gutter 在 overflow: hidden 時不保留，所以不能放在 html） */
  html { height: 100%; overflow: hidden; }
  body { height: 100%; overflow-y: auto; scrollbar-gutter: stable; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ===== 圖示 ===== */
  .ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex: none; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .bar.indet i { animation: none; }
    .adv > summary .chev, .settings details > summary .chev { transition: none; }
  }

  /* ===== 版面 ===== */
  .app {
    max-width: 1100px; margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; gap: 16px; }
  }
  .hdr { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .brand h1 { font: inherit; margin: 0; }
  .brand .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 15px; }
  .brand .ver { font-family: var(--mono); font-size: 0.78rem; font-weight: 400; color: var(--muted); }
  /* 頁首右側：主題切換（#37）與設定兩顆 icon 按鈕 */
  .hdr .actions { display: flex; align-items: center; gap: 8px; }
  /* 頁面層級提示（#31）：任一工作自動更新下載工具後仍失敗時，顯示在頁首下方、輸入區上方，跨兩欄；沒有按鈕 */
  .banner { grid-column: 1 / -1; display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-card); font-size: 0.88rem; color: var(--fg); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .banner .ic { color: var(--warn); margin-top: 0.25em; }

  /* ===== 按鈕 ===== */
  button { font: inherit; font-size: 0.88rem; padding: 7px 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
  .ibtn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: var(--r-btn); width: 34px; height: 34px; display: inline-grid; place-items: center; font-size: 1rem; padding: 0; }
  .ibtn.sm { width: 28px; height: 28px; font-size: 0.9rem; border-radius: 7px; }
  .ibtn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .ibtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .ibtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

  /* ===== 面板與欄位 ===== */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
  .lbl { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .ta { width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: var(--r-btn); padding: 10px; font-family: var(--mono); font-size: 0.8rem; line-height: 1.6; background: var(--sub); color: var(--fg); resize: vertical; }
  .ta::placeholder { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
  .errors { color: var(--bad); margin: 0; padding-left: 18px; font-size: 0.82rem; }
  .errors:empty { display: none; }
  .form-error { color: var(--bad); font-size: 0.85rem; display: flex; gap: 6px; align-items: flex-start; }
  .form-error:empty { display: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .notice { color: var(--ok); font-size: 0.85rem; }
  .notice:empty { display: none; }

  /* 輸出選項卡 */
  .out { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--panel); overflow: hidden; }
  .out.on { border-color: var(--accent); }
  .out-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; min-height: 44px; }
  .out.on .out-h { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .out-h input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .out-h .t { font-weight: 600; font-size: 0.9rem; display: flex; gap: 8px; align-items: center; }
  .out-h .sum { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .out-b { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .out:not(.on) .out-b { display: none; }
  .sub { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; font-size: 0.82rem; }
  .sub .k { color: var(--muted); font-size: 0.74rem; display: inline-flex; gap: 5px; align-items: center; }
  .sub.dim { opacity: 0.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; min-height: 28px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8rem; cursor: pointer; background: var(--panel); color: var(--fg); }
  .chip input { margin: 0; accent-color: var(--accent); width: 14px; height: 14px; }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .chip small { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; background: var(--sub); }
  .seg label { position: relative; padding: 3px 9px; min-height: 24px; border-radius: 5px; font-size: 0.76rem; font-family: var(--mono); cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .seg label.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .adv { border-top: 1px dashed var(--line); padding-top: 8px; }
  /* 收合標題共用：隱藏原生三角形，用 .chev 取代，展開時轉 180° */
  .adv > summary, .settings details > summary { list-style: none; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; min-height: 28px; }
  .adv > summary::-webkit-details-marker, .settings details > summary::-webkit-details-marker { display: none; }
  .adv > summary .chev, .settings details > summary .chev { transition: transform 150ms; }
  .adv[open] > summary .chev, .settings details[open] > summary .chev { transform: rotate(180deg); }
  .adv > summary { font-size: 0.76rem; }
  .adv .sub { margin-top: 8px; }

  /* 檔名列 */
  #names { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .name { display: grid; grid-template-columns: 1fr; gap: 2px; min-width: 0; }
  .name .u { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 5px; align-items: center; }
  .name input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 0.85rem; background: var(--panel); color: var(--fg); }
  .name input::placeholder { color: var(--muted); }

  /* 開始 */
  .go { width: 100%; padding: 11px 14px; border-radius: var(--r-btn); border: 0; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer; display: flex; justify-content: center; gap: 10px; align-items: center; min-height: 44px; }
  .go:hover:not(:disabled) { filter: brightness(1.08); }
  .go .cnt { font-family: var(--mono); font-weight: 500; font-size: 0.74rem; opacity: 0.85; background: rgba(0, 0, 0, 0.15); padding: 2px 8px; border-radius: 999px; }
  .go .cnt:empty { display: none; }

  /* ===== 排隊 ===== */
  .q { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .qh { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
  #jobs, #jobs-done { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  #jobs:empty, #jobs-done:empty { display: none; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 12px 14px; display: grid; gap: 8px; border-left-width: 3px; min-width: 0; }
  .job.running { border-left-color: var(--accent); }
  .job.done { border-left-color: var(--ok); }
  .job.failed { border-left-color: var(--bad); }
  .job.queued, .job.cancelled { border-left-color: var(--line); }
  .jt { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .jt .n { font-weight: 600; font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
  .st { font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .running .st { color: var(--accent); } .done .st { color: var(--ok); } .failed .st { color: var(--bad); } .queued .st, .cancelled .st { color: var(--muted); }
  .kv { display: grid; grid-template-columns: 18px 1fr; gap: 3px 8px; font-size: 0.76rem; font-family: var(--mono); color: var(--muted); align-items: center; }
  .kv .ic { color: var(--muted); }
  .kv b { font-weight: 400; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv a { color: var(--accent); text-decoration: none; }
  .kv a:hover { text-decoration: underline; }
  .outs { display: flex; gap: 6px; flex-wrap: wrap; }
  .o { font-size: 0.72rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-family: var(--mono); max-width: 100%; }
  .o > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .o.did { border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); }
  .o.now { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .o.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
  .bar { height: 6px; border-radius: 3px; background: var(--sub); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.indet i { width: 30%; animation: indet 1.2s ease-in-out infinite alternate; }
  @keyframes indet { from { transform: translateX(-20%); } to { transform: translateX(260%); } }
  .pct { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .err { font-size: 0.8rem; color: var(--bad); display: flex; gap: 6px; align-items: flex-start; }
  .err .ic { margin-top: 0.2em; }
  .detail { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); margin: 0; font-family: var(--mono); font-size: 0.72rem; background: var(--sub); border-radius: 7px; padding: 8px 10px; }
  .divider { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 12px; font-size: 0.85rem; border: 1px dashed var(--line); border-radius: var(--r-panel); }

  /* ===== 設定 ===== */
  .kvline { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 0.85rem; }
  .kvline .k { color: var(--muted); font-size: 0.74rem; }
  #output-dir { overflow-wrap: anywhere; font-family: var(--mono); font-size: 0.8rem; }
  .settings details > summary { font-size: 0.8rem; }
  .settings details .row { margin-top: 8px; }
  /* 「進階」底下的狀態訊息與按鈕列分開（#20） */
  .settings details .notice { margin-top: 8px; }
  /* 設定視窗底部的贊助連結（#41）：小字、--muted 色，不搶戲；hover 才變 accent */
  .settings .kofi { justify-self: end; font-size: 0.74rem; color: var(--muted); text-decoration: none; }
  .settings .kofi:hover { color: var(--accent); text-decoration: underline; }

  /* ===== 對話框 ===== */
  dialog { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); color: var(--fg); max-width: min(420px, calc(100vw - 32px)); padding: 20px; font-family: var(--sans); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  /* 設定 modal：桌面 480px 置中、窄版貼齊 16px 邊距；內容過高時 dialog 內捲、頁面不捲 */
  dialog.settings { width: min(480px, calc(100vw - 32px)); max-width: none; padding: 16px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; overscroll-behavior: contain; }
  dialog.settings[open] { display: grid; gap: 14px; align-content: start; }
  body:has(dialog.settings[open]) { overflow: hidden; }
  dialog p { margin: 0 0 16px; font-weight: 600; overflow-wrap: anywhere; }
  .dialog-buttons { display: flex; flex-direction: column; gap: 8px; }
  .dialog-buttons button { padding: 10px 14px; }
  .ended { text-align: center; padding: 80px 16px; font-size: 1.2rem; }
</style>
</head>

<script>
"use strict";

// ===== 輸出選項狀態機（純函式；tests/outputs_state.test.mjs 以 node 直接測這一段） =====
// @@outputs-state-begin
const VERSION_ORDER = ["original", "instrumental", "vocals"];
const VERSION_LABELS = { original: "原曲", instrumental: "伴奏", vocals: "人聲" };
const FORMATS = ["mp3", "m4a", "wav", "flac"];
const MODELS = ["htdemucs", "htdemucs_ft"];
const MAX_HEIGHTS = [1080, 720];

// 每次載入都回到預設：只勾音檔、只勾原曲；細項由 GET /api/settings 覆寫
function defaultOutputState() {
  return {
    audio: true, versions: { original: true, instrumental: false, vocals: false },
    format: "mp3", model: "htdemucs_ft",
    video: false, maxHeight: null,
  };
}

function orderedVersions(versions) {
  return VERSION_ORDER.filter((v) => versions[v]);
}

function needsSeparation(state) {
  return !!(state.versions.instrumental || state.versions.vocals);
}

// POST /api/jobs 的 outputs；沒勾的那邊送 null
function outputsPayload(state) {
  return {
    audio: state.audio
      ? { versions: orderedVersions(state.versions), format: state.format, model: state.model }
      : null,
    video: state.video ? { max_height: state.maxHeight } : null,
  };
}

// 每個網址會產生幾個檔案
function outputCount(state) {
  return (state.audio ? orderedVersions(state.versions).length : 0) + (state.video ? 1 : 0);
}

function audioSummary(state) {
  const names = orderedVersions(state.versions).map((v) => VERSION_LABELS[v]);
  return `${state.format.toUpperCase()} · ${names.length ? names.join(" + ") : "未選版本"}`;
}

function videoSummary(state) {
  return `MP4 · ${state.maxHeight ? `${state.maxHeight}p` : "最佳畫質"}`;
}

// 「開始」是否可按與原因；files = 網址數 × 每網址輸出數
function startStatus(state, urlCount) {
  let reason = "";
  if (!state.audio && !state.video) reason = "至少要選一種輸出";
  else if (state.audio && orderedVersions(state.versions).length === 0) reason = "音檔至少要勾一個版本";
  return { ok: !reason, reason, files: outputCount(state) * urlCount };
}

// GET /api/exists 的 query string
function existsQuery(state, filename) {
  const params = new URLSearchParams({ filename });
  if (state.audio) {
    params.set("versions", orderedVersions(state.versions).join(","));
    params.set("format", state.format);
  }
  if (state.video) params.set("video", "true");
  return params.toString();
}

// 把 GET /api/settings 的細項套進狀態；不合法的值維持原樣
function applySettings(state, settings) {
  const next = { ...state, versions: { ...state.versions } };
  if (FORMATS.includes(settings.audio_format)) next.format = settings.audio_format;
  if (MODELS.includes(settings.demucs_model)) next.model = settings.demucs_model;
  if (settings.video_max_height === null || MAX_HEIGHTS.includes(settings.video_max_height)) {
    next.maxHeight = settings.video_max_height;
  }
  return next;
}
// @@outputs-state-end

// ===== 排隊卡片的純函式（tests/queue_cards.test.mjs 以 node 直接測這一段；需先載入上面的輸出選項區塊） =====
// @@card-fns-begin
const KIND_ICONS = { original: "disc", instrumental: "mic-off", vocals: "mic", video: "film" };
const STATE_ICONS = { queued: "clock", running: "loader", done: "checkc", failed: "xc", cancelled: "x" };
const OUTPUT_STATE_ICONS = { queued: "clock", running: "loader", done: "check", failed: "x" };
const OUTPUT_PILL_CLASS = { done: "did", running: "now", failed: "bad" };
const FINISHED_STATES = ["done", "failed", "cancelled"];

function fmtDuration(seconds) {
  if (typeof seconds !== "number" || !Number.isFinite(seconds)) return "";
  const s = Math.max(0, Math.round(seconds));
  const m = Math.floor(s / 60);
  return m >= 60
    ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
    : `${m}:${String(s % 60).padStart(2, "0")}`;
}

function fmtSize(bytes) {
  if (typeof bytes !== "number" || !Number.isFinite(bytes) || bytes < 0) return "";
  if (bytes < 1024) return `${bytes} B`;
  const units = ["KB", "MB", "GB", "TB"];
  let value = bytes / 1024;
  let i = 0;
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i += 1; }
  return `${value < 10 ? value.toFixed(1) : Math.round(value)} ${units[i]}`;
}

// 膠囊文字：原曲.mp3、伴奏.flac、.mp4 · 1080p；影片的畫質上限由 job.options 組出
function outputLabel(output, options) {
  if (output.kind === "video") {
    const h = options && options.video ? options.video.max_height : null;
    return `.${output.ext}${h ? ` · ${h}p` : ""}`;
  }
  return `${VERSION_LABELS[output.kind] || output.kind}.${output.ext}`;
}

// 標題列右側的狀態文字
function statusText(job) {
  if (job.state === "queued") return job.queue_position ? `#${job.queue_position}` : "排隊中";
  if (job.state === "cancelled") return "已取消";
  if (job.state === "done") return fmtDuration(job.elapsed_seconds) || "完成";
  if (job.step_total) return `${job.step}/${job.step_total} · ${job.step_name || ""}`.trim();
  return job.step_name || (job.state === "failed" ? "失敗" : "處理中");
}

// 計時基準：記下「收到這則 job 時」的 elapsed_seconds / eta_seconds 與本機時刻，
// 之後每秒加上本機經過的時間；不拿本機時鐘去減伺服器的 started_at，避免時鐘差。
function timingBase(job, nowMs) {
  return {
    at: nowMs,
    elapsed: typeof job.elapsed_seconds === "number" ? job.elapsed_seconds : 0,
    eta: typeof job.eta_seconds === "number" ? job.eta_seconds : null,
  };
}

// `已耗時 / ~預估總時`；預估總時 = 收到時的已耗時 + eta，之後不會往下掉（跑過頭就等於已耗時）
function timingText(base, nowMs) {
  const elapsed = base.elapsed + Math.max(0, nowMs - base.at) / 1000;
  if (base.eta === null) return fmtDuration(elapsed);
  const total = Math.max(elapsed, base.elapsed + base.eta);
  return `${fmtDuration(elapsed)} / ~${fmtDuration(total)}`;
}

// 自動更新下載工具後仍失敗（後端 error_kind = update_failed，#27 / #31）：判斷只看欄位，不比對中文訊息
function isUpdateFailed(job) {
  return job.state === "failed" && job.error_kind === "update_failed";
}

// 頁面層級橫幅（#31）：頁面上還有這類失敗的工作、且在它之後沒有任何工作成功過，就提示使用者稍後重開 vid-snatch。
// 之後有工作成功（例如重試成功）代表問題已解，橫幅收起；「清除已完成」把這類卡片移掉也會收起
function showsUpdateFailedBanner(jobs) {
  const failed = jobs.filter(isUpdateFailed);
  if (failed.length === 0) return false;
  const latest = Math.max(...failed.map((j) => j.created_at || 0));
  return !jobs.some((j) => j.state === "done" && (j.created_at || 0) > latest);
}
// @@card-fns-end

const URL_RE = /youtube\.com\/(watch\?|shorts\/|live\/)|youtu\.be\/|music\.youtube\.com\/watch\?/;
const SVG_NS = "http://www.w3.org/2000/svg";

const $ = (id) => document.getElementById(id);
const urlsEl = $("urls");
const startEl = $("start");
const jobsEl = $("jobs");
const doneEl = $("jobs-done");

let outputState = defaultOutputState();

// 每個網址的標題狀態：{ status: "loading" | "ok" | "failed", value, touched, input }
const titles = new Map();
const TITLE_CONCURRENCY = 3;
let titleQueue = [];
let titleActive = 0;
let infoTimer = null;
let shownUrls = [];
let submitting = false;
const cards = new Map();   // job.id -> <li class="job">
const clearedIds = new Set();   // 「清除已完成」隱藏掉的工作；SSE 重連重播時不再畫回來
const expandedDetails = new Set(); // 「查看詳情」展開中的工作，重畫卡片時維持展開
const timing = new Map();   // 進行中工作 id -> timingBase（前端每秒計時用）
let timerId = null;

// ---------- 小工具 ----------

function icon(name, extraClass) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", extraClass ? `ic ${extraClass}` : "ic");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS(SVG_NS, "use");
  use.setAttribute("href", `#i-${name}`);
  svg.append(use);
  return svg;
}

function el(tag, className, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.append(...children);
  return node;
}

function iconButton(name, label, onClick, extraClass) {
  const btn = el("button", extraClass ? `ibtn ${extraClass}` : "ibtn", icon(name));
  btn.type = "button";
  btn.setAttribute("aria-label", label);
  btn.title = label;
  btn.addEventListener("click", onClick);
  return btn;
}

function shortUrl(url) {
  return url.replace(/^https?:\/\/(www\.)?/, "");
}

// ---------- HTTP ----------

async function readError(res) {
  try {
    const body = await res.json();
    if (body && typeof body.message === "string" && body.message) return body.message;
  } catch (e) { /* 非 JSON 回應 */ }
  return "發生錯誤";
}

// fetch 本身失敗（伺服器關閉、斷線）時丟出的是英文 TypeError，統一改成中文
async function getJson(path) {
  let res;
  try {
    res = await fetch(path);
  } catch (e) {
    throw new Error("發生錯誤");
  }
  if (!res.ok) throw new Error(await readError(res));
  return res.json();
}

// POST / DELETE 都要帶 X-Vid-Snatch 防 CSRF
async function sendJson(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", "X-Vid-Snatch": "1" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) {
    throw new Error("發生錯誤");
  }
  if (!res.ok) throw new Error(await readError(res));
  return res.json();
}

function postJson(path, body) {
  return sendJson("POST", path, body);
}

function deleteJson(path) {
  return sendJson("DELETE", path);
}

// ---------- 頁內對話框 ----------

function ask(title, choices) {
  const dialog = $("ask");
  $("ask-title").textContent = title;
  const box = $("ask-buttons");
  box.replaceChildren();
  return new Promise((resolve) => {
    let chosen = null;
    for (const choice of choices) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = choice.label;
      if (choice.className) btn.className = choice.className;
      btn.addEventListener("click", () => { chosen = choice.value; dialog.close(); });
      box.append(btn);
    }
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "取消";
    cancel.addEventListener("click", () => dialog.close());
    box.append(cancel);
    dialog.addEventListener("close", () => resolve(chosen), { once: true });
    dialog.showModal();
  });
}

// ---------- 輸出選項 ----------

function setFormError(text) {
  const box = $("form-error");
  box.replaceChildren();
  if (text) box.append(icon("alert"), document.createTextNode(text));
}

function readOutputState() {
  const state = { ...outputState, versions: { ...outputState.versions } };
  state.audio = $("out-audio").checked;
  state.video = $("out-video").checked;
  for (const cb of document.querySelectorAll("[data-version]")) state.versions[cb.dataset.version] = cb.checked;
  const fmt = document.querySelector('input[name="fmt"]:checked');
  if (fmt) state.format = fmt.value;
  const mdl = document.querySelector('input[name="mdl"]:checked');
  if (mdl) state.model = mdl.value;
  const res = document.querySelector('input[name="res"]:checked');
  if (res) state.maxHeight = res.value ? Number(res.value) : null;
  return state;
}

function checkRadio(name, value) {
  for (const input of document.querySelectorAll(`input[name="${name}"]`)) input.checked = input.value === value;
}

// 把狀態畫回表單：卡片開合、chip / 分段開關的 on、摘要文字、灰掉的列
function renderOutputs() {
  const s = outputState;
  $("out-audio").checked = s.audio;
  $("out-video").checked = s.video;
  $("out-audio-card").classList.toggle("on", s.audio);
  $("out-video-card").classList.toggle("on", s.video);
  for (const cb of document.querySelectorAll("[data-version]")) {
    cb.checked = !!s.versions[cb.dataset.version];
    cb.closest(".chip").classList.toggle("on", cb.checked);
  }
  checkRadio("fmt", s.format);
  checkRadio("mdl", s.model);
  checkRadio("res", s.maxHeight ? String(s.maxHeight) : "");
  for (const label of document.querySelectorAll(".seg label")) {
    label.classList.toggle("on", label.querySelector("input").checked);
  }
  $("audio-summary").textContent = audioSummary(s);
  $("video-summary").textContent = videoSummary(s);
  $("row-model").classList.toggle("dim", !needsSeparation(s));
  $("row-model").title = needsSeparation(s) ? "" : "勾了伴奏或人聲才會用到";
  $("sep-hint").textContent = s.model === "htdemucs" ? "1–2 分" : "3–8 分";
  refreshForm();
}

const SETTING_KEYS = { fmt: "audio_format", mdl: "demucs_model", res: "video_max_height" };

async function onOutputsChange(event) {
  const before = outputState;
  outputState = readOutputState();
  renderOutputs();
  // 細項改了就存回設定；「版本」與兩個大選項不存
  const key = SETTING_KEYS[event.target.name];
  if (!key) return;
  const value = { audio_format: outputState.format, demucs_model: outputState.model,
                  video_max_height: outputState.maxHeight }[key];
  const previous = { audio_format: before.format, demucs_model: before.model,
                     video_max_height: before.maxHeight }[key];
  if (value === previous) return;
  try {
    await postJson("/api/settings", { [key]: value });
  } catch (e) {
    setFormError(`細項沒有存成功：${e.message || "發生錯誤"}`);
  }
}

// ---------- 網址輸入 ----------

function readLines() {
  const valid = [];
  const bad = [];
  urlsEl.value.split("\n").forEach((raw, index) => {
    const line = raw.trim();
    if (!line) return;
    if (!URL_RE.test(line)) bad.push(index + 1);
    else if (!valid.includes(line)) valid.push(line);
  });
  return { valid, bad };
}

function refreshForm() {
  const { valid, bad } = readLines();
  const errorsEl = $("url-errors");
  errorsEl.replaceChildren(...bad.map((n) => {
    const li = document.createElement("li");
    li.textContent = `第 ${n} 行不是 YouTube 網址`;
    return li;
  }));
  const loading = valid.some((u) => {
    const status = titles.get(u)?.status;
    return status === undefined || status === "loading";
  });
  const status = startStatus(outputState, valid.length);
  startEl.disabled = submitting || loading || valid.length === 0 || bad.length > 0 || !status.ok;
  startEl.title = status.reason;
  $("start-label").textContent = submitting ? "處理中…" : loading ? "讀取影片標題中…" : "開始";
  $("start-count").textContent = !status.ok ? status.reason
    : valid.length ? `${valid.length} 網址 · ${status.files} 檔案` : "";
  return { valid, bad };
}

// ---------- 檔名清單 ----------

function renderNames(urls) {
  const same = urls.length === shownUrls.length && urls.every((u, i) => u === shownUrls[i]);
  if (same) return;
  shownUrls = urls;
  const list = $("names");
  list.replaceChildren(...urls.map((url) => {
    const entry = titles.get(url);
    const li = el("li", "name");
    const label = el("span", "u", icon("link"), document.createTextNode(shortUrl(url)));
    label.title = url;
    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    input.setAttribute("aria-label", `${url} 的檔名`);
    input.value = entry.value;
    input.disabled = submitting;
    input.addEventListener("input", () => { entry.value = input.value; entry.touched = true; });
    entry.input = input;
    updatePlaceholder(entry);
    li.append(label, input);
    return li;
  }));
  $("names-row").hidden = urls.length === 0;
}

function updatePlaceholder(entry) {
  if (!entry.input) return;
  entry.input.placeholder = {
    loading: "讀取影片標題中…",
    ok: "留空則用原標題",
    failed: "讀不到標題，可自己輸入檔名",
  }[entry.status];
}

function queueTitles(urls) {
  for (const url of urls) {
    if (titles.has(url)) continue;
    titles.set(url, { status: "loading", value: "", touched: false, input: null });
    titleQueue.push(url);
  }
  pumpTitles();
}

function pumpTitles() {
  while (titleActive < TITLE_CONCURRENCY && titleQueue.length) {
    const url = titleQueue.shift();
    titleActive += 1;
    fetchTitle(url).finally(() => { titleActive -= 1; pumpTitles(); });
  }
}

async function fetchTitle(url) {
  const entry = titles.get(url);
  try {
    const data = await getJson(`/api/info?url=${encodeURIComponent(url)}`);
    entry.status = "ok";
    if (!entry.touched) {
      entry.value = data.title || "";
      if (entry.input) entry.input.value = entry.value;
    }
  } catch (e) {
    // 取不到標題不影響下載，使用者仍可自己填檔名
    entry.status = "failed";
  }
  updatePlaceholder(entry);
  refreshForm();
}

function onUrlsInput() {
  setFormError("");
  clearTimeout(infoTimer);
  // 打字中先擋住「開始」，停 500ms 後再讀標題、列檔名
  startEl.disabled = true;
  infoTimer = setTimeout(() => {
    const { valid } = readLines();
    queueTitles(valid);
    renderNames(valid);
    refreshForm();
  }, 500);
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) return;
    const current = urlsEl.value;
    urlsEl.value = current && !current.endsWith("\n") ? `${current}\n${text}` : current + text;
    onUrlsInput();
  } catch (e) {
    // 沒有剪貼簿權限或非 secure context：靜默忽略
  }
}

// ---------- 開始下載 ----------

function setSubmitting(value) {
  submitting = value;
  urlsEl.disabled = value;
  for (const entry of titles.values()) if (entry.input) entry.input.disabled = value;
  $("paste").disabled = value;
  for (const input of document.querySelectorAll("#input .out input")) input.disabled = value;
  refreshForm();
}

async function resolveOverwrite(state, filename) {
  if (!filename) return { filename, overwrite: false };
  const check = await getJson(`/api/exists?${existsQuery(state, filename)}`);
  if (!check.exists) return { filename, overwrite: false };
  const choice = await ask(`已有同名檔案「${filename}」`, [
    { label: "覆蓋", value: "overwrite", className: "primary" },
    { label: `另存為 ${check.suggestion}`, value: "rename" },
  ]);
  if (choice === "overwrite") return { filename, overwrite: true };
  if (choice === "rename") return { filename: check.suggestion, overwrite: false };
  return null;
}

async function startJobs() {
  const { valid, bad } = readLines();
  if (valid.length === 0 || bad.length > 0) return;
  if (startEl.disabled) return;
  const state = outputState;
  if (!startStatus(state, valid.length).ok) return;
  setFormError("");
  setSubmitting(true);
  try {
    const filenames = [];
    const overwrites = [];
    for (const url of valid) {
      const decision = await resolveOverwrite(state, titles.get(url).value.trim());
      if (decision === null) return;
      filenames.push(decision.filename || null);
      overwrites.push(decision.overwrite);
    }
    const data = await postJson("/api/jobs", { urls: valid, outputs: outputsPayload(state), filenames, overwrites });
    (data.jobs || []).forEach(renderIfNew);
    urlsEl.value = "";
    titles.clear();
    renderNames([]);
  } catch (e) {
    setFormError(e.message || "發生錯誤");
  } finally {
    setSubmitting(false);
  }
}

// ---------- 工作卡片 ----------
// 卡片結構照 docs/design/console-mockup.html；資料欄位見 docs/superpowers/specs/2026-10-27-console-ui-design.md。
// 每則 SSE 都整張重畫（replaceChildren），展開中的「查看詳情」以 expandedDetails 記住。

function cardActionError(card, message) {
  let box = card.querySelector(".card-action-error");
  if (!box) {
    box = el("div", "err card-action-error");
    card.append(box);
  }
  box.replaceChildren(icon("alert"), document.createTextNode(message));
}

function isFinished(state) {
  return FINISHED_STATES.includes(state);
}

function listFor(state) {
  return isFinished(state) ? doneEl : jobsEl;
}

// 細節列：來源網址（開新分頁）、原標題、已存檔名與大小
function buildDetails(job) {
  const kv = el("div", "kv");
  const link = document.createElement("a");
  link.href = job.url;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = shortUrl(job.url);
  link.title = job.url;
  kv.append(icon("link"), el("b", "", link));
  if (job.title) {
    const title = el("b", "");
    title.textContent = job.title;
    title.title = job.title;
    kv.append(icon("title"), title);
  }
  for (const output of job.outputs || []) {
    if (output.state !== "done" || !output.filename) continue;
    const size = fmtSize(output.size_bytes);
    const file = el("b", "");
    file.textContent = size ? `${output.filename} · ${size}` : output.filename;
    file.title = output.result_path || output.filename;
    kv.append(icon("file"), file);
  }
  return kv;
}

// 輸出列：每個輸出檔一顆膠囊，含類型圖示、尾綴與細項摘要、自己的狀態圖示
function buildOutputs(job) {
  const outs = el("div", "outs");
  const showState = job.state !== "queued" && job.state !== "cancelled";
  for (const output of job.outputs || []) {
    const pill = el("span", OUTPUT_PILL_CLASS[output.state] ? `o ${OUTPUT_PILL_CLASS[output.state]}` : "o");
    const label = el("span", "");
    label.textContent = outputLabel(output, job.options);
    pill.append(icon(KIND_ICONS[output.kind] || "file"), label);
    if (showState && OUTPUT_STATE_ICONS[output.state]) {
      pill.append(icon(OUTPUT_STATE_ICONS[output.state], output.state === "running" ? "spin" : ""));
    }
    if (output.filename) pill.title = output.filename;
    outs.append(pill);
  }
  return outs;
}

function buildProgress(job) {
  const fill = document.createElement("i");
  const bar = el("div", "bar", fill);
  const known = typeof job.percent === "number";
  if (known) fill.style.width = `${Math.max(0, Math.min(100, job.percent))}%`;
  else bar.classList.add("indet");
  bar.setAttribute("role", "progressbar");
  bar.setAttribute("aria-label", "進度");
  if (known) bar.setAttribute("aria-valuenow", String(Math.round(job.percent)));
  const time = el("span", "time");
  time.textContent = timingText(timing.get(job.id), performance.now());
  const pct = el("div", "pct", el("span", "", document.createTextNode(known ? `${Math.round(job.percent)}%` : "")), time);
  return [bar, pct];
}

function retryButton(job, card) {
  return iconButton("retry", "重試", async (event) => {
    const btn = event.currentTarget;
    btn.disabled = true;
    try { renderIfNew(await postJson(`/api/jobs/${job.id}/retry`)); }
    catch (e) { btn.disabled = false; cardActionError(card, e.message || "發生錯誤"); }
  }, "sm");
}

function buildCardBody(job, card) {
  const parts = [];

  const name = el("span", "n");
  name.textContent = job.filename || job.display_name || job.url;
  const st = el("span", "st", icon(STATE_ICONS[job.state] || "info", job.state === "running" ? "spin" : ""));
  st.append(document.createTextNode(statusText(job)));
  parts.push(el("div", "jt", name, st), buildDetails(job));
  if (job.outputs && job.outputs.length) parts.push(buildOutputs(job));

  if (job.state === "running") parts.push(...buildProgress(job));

  if (job.state === "queued") {
    parts.push(el("div", "acts", iconButton("x", "取消", async (event) => {
      const btn = event.currentTarget;
      btn.disabled = true;
      try { renderJob(await deleteJson(`/api/jobs/${job.id}`)); }
      catch (e) { btn.disabled = false; cardActionError(card, e.message || "發生錯誤"); }
    }, "sm ghost")));
  }

  if (job.state === "done") {
    parts.push(el("div", "acts", iconButton("folder", "顯示檔案", async () => {
      try { await postJson(`/api/jobs/${job.id}/reveal`); }
      catch (e) { cardActionError(card, e.message || "發生錯誤"); }
    }, "sm")));
  }

  if (job.state === "cancelled") {
    parts.push(el("div", "acts", retryButton(job, card)));
  }

  if (job.state === "failed") {
    parts.push(el("div", "err", icon("alert"), document.createTextNode(job.message || "發生錯誤")));
    const acts = el("div", "acts");
    if (job.detail) {
      const pre = el("pre", "detail");
      pre.textContent = job.detail;
      pre.hidden = !expandedDetails.has(job.id);
      const eye = iconButton("eye", "查看詳情", () => {
        pre.hidden = !pre.hidden;
        if (pre.hidden) expandedDetails.delete(job.id); else expandedDetails.add(job.id);
        eye.setAttribute("aria-expanded", String(!pre.hidden));
      }, "sm ghost");
      eye.setAttribute("aria-expanded", String(!pre.hidden));
      acts.append(eye);
      parts.push(pre);
    }
    acts.append(retryButton(job, card));
    parts.push(acts);
  }

  return parts;
}

// POST 回應可能比 SSE 推來的狀態還舊；卡片已存在時以 SSE 為準
function renderIfNew(job) {
  if (!cards.has(job.id)) renderJob(job);
}

function renderJob(job) {
  if (clearedIds.has(job.id)) return; // 使用者已清掉的完成卡片（SSE 重連會重播）
  let card = cards.get(job.id);
  if (!card) {
    card = document.createElement("li");
    cards.set(job.id, card);
  }
  // 狀態變成完成 / 失敗 / 取消時搬到「已完成」區；新卡片一律放最上面（新到舊）
  const list = listFor(job.state);
  if (card.parentNode !== list) list.prepend(card);
  if (job.state === "running") timing.set(job.id, timingBase(job, performance.now()));
  else timing.delete(job.id);
  if (job.state !== "failed") expandedDetails.delete(job.id);
  card.className = `job ${job.state}`;
  card.dataset.id = job.id;
  card.dataset.state = job.state;
  // 頁面層級橫幅（#31）要看所有卡片的失敗類型與先後
  card.dataset.errorKind = job.error_kind || "";
  card.dataset.createdAt = String(job.created_at || 0);
  card.replaceChildren(...buildCardBody(job, card));
  refreshQueueChrome();
  syncTimer();
}

// 頁面上所有卡片的狀態摘要（橫幅判斷用；資料存在 dataset，重畫不用再查後端）
function cardJobs() {
  return [...cards.values()].map((c) => ({
    state: c.dataset.state, error_kind: c.dataset.errorKind || null, created_at: Number(c.dataset.createdAt) || 0,
  }));
}

// 空狀態、「已完成」分隔線、頁面層級橫幅（#31）的顯示
function refreshQueueChrome() {
  const empty = $("jobs-empty");
  empty.hidden = jobsEl.childElementCount > 0;
  empty.textContent = cards.size > 0 ? "沒有進行中的工作" : "還沒有下載工作";
  $("done-divider").hidden = doneEl.childElementCount === 0;
  $("update-failed").hidden = !showsUpdateFailedBanner(cardJobs());
}

// 「已耗時 / 預估總時」每秒由前端更新；沒有進行中的卡片就停掉計時器
function tickTimers() {
  const now = performance.now();
  for (const [id, base] of timing) {
    const span = cards.get(id)?.querySelector(".pct .time");
    if (span) span.textContent = timingText(base, now);
  }
}

function syncTimer() {
  if (timing.size > 0 && timerId === null) timerId = setInterval(tickTimers, 1000);
  else if (timing.size === 0 && timerId !== null) { clearInterval(timerId); timerId = null; }
}

// 「清除已完成」只在前端隱藏；後端仍保留工作
function clearDone() {
  for (const card of [...doneEl.children]) {
    const id = card.dataset.id;
    clearedIds.add(id);
    cards.delete(id);
    expandedDetails.delete(id);
    card.remove();
  }
  refreshQueueChrome();
}

async function loadJobs() {
  try {
    const data = await getJson("/api/jobs");
    (data.jobs || []).forEach(renderJob);
  } catch (e) { /* SSE 連上後會補齊 */ }
}

function connectEvents() {
  const source = new EventSource("/api/events");
  source.addEventListener("job", (event) => {
    try { renderJob(JSON.parse(event.data)); } catch (e) { /* 忽略壞資料 */ }
  });
  // 斷線時瀏覽器會自動重連
}

// ---------- 設定 ----------

// 設定是 modal（原生 <dialog>）：開關不推擠版面；Esc 走原生 cancel，關閉後焦點回到齒輪
function openSettings() {
  const dialog = $("settings");
  if (dialog.open) return;
  dialog.showModal();
  $("settings-toggle").setAttribute("aria-expanded", "true");
}

function onSettingsClosed() {
  const btn = $("settings-toggle");
  btn.setAttribute("aria-expanded", "false");
  btn.focus();
}

// 點 backdrop 關閉：backdrop 的事件 target 是 dialog 本身，再用座標排除 dialog 內的 padding
function onSettingsBackdropClick(event) {
  const dialog = $("settings");
  if (event.target !== dialog) return;
  const r = dialog.getBoundingClientRect();
  const inside = event.clientX >= r.left && event.clientX <= r.right && event.clientY >= r.top && event.clientY <= r.bottom;
  if (!inside) dialog.close();
}

// 頁首版本號：來自 GET /api/settings 的 version；取不到就不顯示
function showVersion(version) {
  const ver = $("version");
  if (typeof version !== "string" || !version) return;
  ver.textContent = `v${version}`;
  ver.hidden = false;
}

// 主題（#37）：目前設定值以 <html data-theme> 為準（head 的早期套用腳本已從 localStorage 讀過），沒有就是跟隨系統
const systemDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");

function currentTheme() {
  return parseTheme(document.documentElement.getAttribute("data-theme") || "system");
}

function effectiveTheme() {
  return resolveTheme(currentTheme(), systemDarkQuery.matches);
}

// 頁首按鈕：圖示與標籤都是「點了會切到的主題」——淺色時畫月亮「切換為深色」，深色時畫太陽「切換為淺色」
function renderThemeToggle() {
  const next = nextTheme(effectiveTheme());
  const label = next === "dark" ? "切換為深色" : "切換為淺色";
  const btn = $("theme-toggle");
  btn.setAttribute("aria-label", label);
  btn.title = label;
  $("theme-icon").setAttribute("href", next === "dark" ? "#i-moon" : "#i-sun");
}

// 點一下切到與目前實際顯示相反的主題並固定下來、存進 localStorage（純個人偏好，不經後端）；存不進去就只在這次分頁生效
function toggleTheme() {
  const theme = nextTheme(effectiveTheme());
  applyTheme(document.documentElement, theme);
  writeTheme(() => localStorage, theme);
  renderThemeToggle();
}

async function loadSettings() {
  try {
    const data = await getJson("/api/settings");
    $("output-dir").textContent = data.output_dir;
    showVersion(data.version);
    outputState = applySettings(outputState, data);
    renderOutputs();
  } catch (e) {
    $("output-dir").textContent = e.message || "發生錯誤";
  }
}

async function pickFolder() {
  const btn = $("pick-folder");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "選擇中…";
  try {
    const data = await postJson("/api/settings/pick-folder");
    $("output-dir").textContent = data.output_dir;
    if (data.changed) $("folder-notice").hidden = false;
  } catch (e) {
    showAdvancedNotice(e.message || "發生錯誤");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function showEnded() {
  const box = document.createElement("div");
  box.className = "ended";
  box.textContent = "vid-snatch 已結束，可以關閉此分頁";
  document.body.replaceChildren(box);
}

async function shutdown() {
  $("shutdown").disabled = true;
  try {
    await postJson("/api/shutdown");
  } catch (e) {
    // server 可能在回應前就關掉，仍視為已結束
  }
  showEnded();
}

function showAdvancedNotice(text) {
  const box = $("advanced-notice");
  box.textContent = text;
  box.hidden = false;
}

async function uninstall() {
  const choice = await ask("是否一併刪除已下載的檔案？", [
    { label: "刪除下載檔案並解除安裝", value: "delete", className: "danger" },
    { label: "保留檔案並解除安裝", value: "keep" },
  ]);
  if (choice === null) return;
  try {
    await postJson("/api/uninstall", { delete_downloads: choice === "delete" });
    showAdvancedNotice("正在解除安裝…");
  } catch (e) {
    showAdvancedNotice(e.message || "發生錯誤");
  }
}

// ---------- 啟動 ----------

urlsEl.addEventListener("input", onUrlsInput);
urlsEl.addEventListener("keydown", (event) => {
  // Ctrl/Cmd + Enter 直接開始
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); startJobs(); }
});
$("paste").addEventListener("click", pasteFromClipboard);
startEl.addEventListener("click", startJobs);
for (const input of document.querySelectorAll("#input .out input")) input.addEventListener("change", onOutputsChange);
$("settings-toggle").addEventListener("click", openSettings);
$("settings-close").addEventListener("click", () => $("settings").close());
$("settings").addEventListener("click", onSettingsBackdropClick);
$("settings").addEventListener("close", onSettingsClosed);
$("theme-toggle").addEventListener("click", toggleTheme);
// 跟隨系統時系統切換深淺，CSS 會自己跟著變，這裡只要把按鈕圖示更新
systemDarkQuery.addEventListener("change", renderThemeToggle);
$("pick-folder").addEventListener("click", pickFolder);
$("shutdown").addEventListener("click", shutdown);
$("uninstall").addEventListener("click", uninstall);
$("clear-done").addEventListener("click", clearDone);

renderThemeToggle();
renderOutputs();
loadSettings();
loadJobs();
connectEvents();
</script>
</body>
</html>
