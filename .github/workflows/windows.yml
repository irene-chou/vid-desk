name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts (Windows PowerShell 5.1) and check BOM
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $failed = $false
          foreach ($f in @('vid-snatch.ps1', 'windows\launcher.ps1', 'windows\ci-smoke.ps1')) {
            $path = (Resolve-Path -LiteralPath $f).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            foreach ($e in @($errors)) {
              if ($e) {
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
                $failed = $true
              }
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "::error file=$f::missing UTF-8 BOM"
              $failed = $true
            }
            Write-Host "checked $f"
          }
          if ($failed) { exit 1 }

  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .[dev]

      - name: Test
        run: pytest -q -W error

  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # http.server 用來佔住 8080；vid-snatch 本身用 uv 自己下載的 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke test native install
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\ci-smoke.ps1
          exit $LASTEXITCODE
