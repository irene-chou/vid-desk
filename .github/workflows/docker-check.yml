name: Docker check

# publish.yml 只在推 v* 標籤時建置並推送；這裡在 PR 先確認映像檔能建、能離線去人聲、網頁伺服器能啟動（不推送）
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: vid-snatch:ci
    steps:
      - uses: actions/checkout@v4

      # Windows runner 沒有可靠的 bash：Mac 啟動腳本的更新檢查邏輯（假 docker 指令）在這裡跑
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mac launcher update check (bash, fake docker)
        run: |
          pip install pytest
          pytest -q -W error --noconftest tests/test_mac_command.py

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          # 與 publish.yml 共用同一個快取範圍
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

      - name: CLI --help
        run: docker run --rm "$IMAGE" --help

      - name: Remove vocals offline with both models (synthetic 2 s WAV)
        run: |
          work="$RUNNER_TEMP/vocal"
          mkdir -p "$work"
          cat > "$work/check.py" <<'EOF'
          import math, struct, sys, time, wave
          from pathlib import Path

          from vid_snatch.core import separate
          from vid_snatch.models import DEMUCS_MODELS

          work = Path(sys.argv[1])
          src = work / "測試 歌曲.wav"
          rate = 44100
          with wave.open(str(src), "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = bytearray()
              for i in range(rate * 2):
                  t = i / rate
                  left = 0.3 * math.sin(2 * math.pi * 220 * t) + 0.2 * math.sin(2 * math.pi * 440 * t)
                  right = 0.3 * math.sin(2 * math.pi * 220 * t) + 0.2 * math.sin(2 * math.pi * 330 * t)
                  frames += struct.pack("<hh", int(left * 32767), int(right * 32767))
              w.writeframes(bytes(frames))

          # 兩個可選模型都要能離線載入；一次 demucs 同時寫出伴奏與人聲
          failed = False
          for model in DEMUCS_MODELS:
              out_dir = work / model
              out_dir.mkdir()
              start = time.monotonic()
              outs = separate(src, out_dir, model=model, stems=("instrumental", "vocals"))
              for stem, path in outs.items():
                  size = path.stat().st_size if path.exists() else -1
                  print(f"separate[{model}] {stem}: {path} ({size} bytes, {time.monotonic() - start:.1f} s)")
                  failed |= size <= 0
          sys.exit(2 if failed else 0)
          EOF
          # --network none：證明兩個模型都已預載、執行時不需要網路
          docker run --rm --network none -v "$work:/work" --entrypoint python "$IMAGE" /work/check.py /work
          ls -lR "$work"
          for model in htdemucs htdemucs_ft; do
            for suffix in _no_vocals _vocals; do
              f=$(find "$work/$model" -name "*${suffix}.mp3" -size +0c | head -n 1)
              if [ -z "$f" ]; then echo "::error::$model 沒有產生非空的 ${suffix}.mp3"; exit 1; fi
              echo "OK: $f"
            done
          done

      - name: Web server health
        run: |
          docker run -d --name vs-web -p 127.0.0.1:8080:8080 "$IMAGE" --web --port 8080
          ok=
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then ok=1; break; fi
            sleep 1
          done
          echo
          if [ -z "$ok" ]; then
            echo "::error::/api/health 60 秒內沒有回應"
            docker logs vs-web
            docker rm -f vs-web
            exit 1
          fi
          docker stop -t 10 vs-web
          docker logs vs-web
          docker rm vs-web
